version: 2

project_name: cashctl

builds:
  - id: cashctl
    main: .
    binary: cashctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/ohstr/cashctl/cmd.Version={{.Version}}+{{.ShortCommit}}

archives:
  - id: cashctl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# dockers_v2 (buildx, single multi-platform build) hit intermittent
# "failed to calculate checksum of ref ...: not found" COPY failures in CI
# on ncli's own release pipeline, twice in a row on linux/amd64, that
# couldn't be pinned down or reproduced locally. Rolled back to the older
# per-arch dockers + docker_manifests pipe (deprecated but battle-tested):
# each arch gets its own single-platform buildx build, then
# docker_manifests stitches the two per-arch tags into the multi-arch tag.
#
# Each arch is split into a "-versioned" entry (always pushed, so every
# release -- including an RC -- gets an installable image under its own
# tag) and a "-latest" entry (skip_push: auto, so only a stable release
# ever moves the latest-* tags). A single entry can't do both: skip_push
# applies to every image_template in that entry, so latest can't be
# pushed if the version tag doesn't push too. See RELEASE_CANDIDATES.md.
dockers:
  - id: cashctl-amd64-versioned
    ids: [cashctl]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: build/cashctl/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/cashctl:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: cashctl-amd64-latest
    ids: [cashctl]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: build/cashctl/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/cashctl:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
    skip_push: auto
  - id: cashctl-arm64-versioned
    ids: [cashctl]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: build/cashctl/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/cashctl:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
  - id: cashctl-arm64-latest
    ids: [cashctl]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: build/cashctl/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/cashctl:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
    skip_push: auto

# Same split as above, one level up: the versioned manifest always
# stitches the two versioned per-arch tags; the latest manifest only
# stitches the two latest-* tags, and only pushes for a stable release.
docker_manifests:
  - name_template: "ghcr.io/ohstr/cashctl:{{ .Version }}"
    image_templates:
      - "ghcr.io/ohstr/cashctl:{{ .Version }}-amd64"
      - "ghcr.io/ohstr/cashctl:{{ .Version }}-arm64"
  - name_template: "ghcr.io/ohstr/cashctl:latest"
    image_templates:
      - "ghcr.io/ohstr/cashctl:latest-amd64"
      - "ghcr.io/ohstr/cashctl:latest-arm64"
    skip_push: auto

# brews has no free-tier equivalent of the cask pipe's versioned-formula
# feature, so an RC gets its own formula name instead: skip_upload is auto
# (skip on prerelease) for the stable `cashctl` formula, and the inverse
# for `cashctl-rc` (skip unless it's a prerelease) so `brew install/upgrade
# cashctl` never resolves to an RC, but `brew install ohstr/tap/cashctl-rc`
# can still try one. See RELEASE_CANDIDATES.md.
brews:
  - name: cashctl
    repository:
      owner: ohstr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ohstr/cashctl"
    description: "A wallet CLI for NIP-CASH cash tokens and NIP-CW circle wallets."
    license: "Unlicense"
    conflicts: ["cashctl-rc"]
    install: |
      bin.install "cashctl"
    test: |
      system "#{bin}/cashctl", "version"
    skip_upload: auto
  - name: cashctl-rc
    repository:
      owner: ohstr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ohstr/cashctl"
    description: "Release-candidate build of cashctl -- see the cashctl formula for stable installs."
    license: "Unlicense"
    conflicts: ["cashctl"]
    install: |
      bin.install "cashctl"
    test: |
      system "#{bin}/cashctl", "version"
    skip_upload: '{{ if .Prerelease }}false{{ else }}true{{ end }}'

# No `changelog:` block here, deliberately — GoReleaser's changelog pipe is
# also the only place that loads a `--release-notes` file into the release
# body (internal/pipe/changelog.(Pipe).Run, before it ever reaches the
# auto-changelog-from-commits code that follows that early return).
# release.yml always passes `--release-notes`, so the pipe's own
# early-return already guarantees notes come from CHANGELOG.md, never
# GoReleaser's commit-log changelog — no `disable` needed.
release:
  github:
    owner: ohstr
    name: cashctl
  # Default is keep-existing, which would leave a stale/minimal body in
  # place if a Release for the tag already exists (e.g. from a prior
  # failed/retried run) instead of using --release-notes below.
  mode: replace
  prerelease: auto
