name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - CHANGELOG.md
      - docs/public/**
      - docs/brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

jobs:
  docs:
    # Must be granted here, not inside build-docs.yml itself — a reusable
    # workflow can't self-grant pages/id-token when called cross-repo.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ohstr/docs-kit/.github/workflows/build-docs.yml@main
    with:
      title: cashctl
      description: A wallet CLI for NIP-CASH cash tokens and NIP-CW circle wallets.
      accent-hue: 265 # the logo's purple, #9B5CF6
      favicon: docs/brand/favicon.svg
      logo: docs/brand/cashctl-mark-light.svg
      logo-dark: docs/brand/cashctl-mark.svg
      extra-public-dir: docs/public # install.sh, install.ps1, PROMPT.md
